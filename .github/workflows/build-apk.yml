name: Build Godot Game APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download Godot
      run: |
        wget https://downloads.tuxfamily.org/godotengine/4.2/Godot_v4.2-stable_linux.x86_64.zip
        unzip Godot_v4.2-stable_linux.x86_64.zip
        chmod +x Godot_v4.2-stable_linux.x86_64
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'
    
    - name: Download Android SDK/NDK
      run: |
        mkdir -p android_sdk
        cd android_sdk
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip commandlinetools-linux-9477386_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        cd ../
        export ANDROID_HOME=$(pwd)/android_sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
    
    - name: Export Project
      run: |
        export ANDROID_HOME=$(pwd)/android_sdk
        export ANDROID_SDK_ROOT=$(pwd)/android_sdk
        export ANDROID_NDK_ROOT=$(pwd)/android_sdk/ndk/26.1.10909125
        ./Godot_v4.2-stable_linux.x86_64 -v --export-release "Android" "build/hollow.apk"
      env:
        ANDROID_KEYSTORE: false
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: hollow-horror-apk
        path: build/hollow.apk
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/hollow.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
